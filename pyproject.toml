[project]
name = "matchminer-ai-training"
version = "0.1.0"
description = "Code for training the MatchMiner-AI pipeline"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "accelerate>=1.12",
    "datasets>=4.6",
    "matplotlib>=3.10",
    "numpy>=2.4",
    "openai>=2.8",
    "pandas>=2.3",
    "peft>=0.18",
    "pyarrow>=23.0",
    "requests>=2.32",
    "scikit-learn>=1.8",
    "sentence-transformers>=5.2",
    "torch>=2.10",
    "transformers>=5.2",
    "trl>=0.29",
    "vllm>=0.16",
]

[dependency-groups]
training = [
    "bitsandbytes>=0.49",
    "flash-attn>=2.8",
    "liger-kernel>=0.7",
]
