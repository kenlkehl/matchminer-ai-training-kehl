[project]
name = "matchminer-ai-training"
version = "0.1.0"
description = "Code for training the MatchMiner-AI pipeline"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "accelerate>=1.12",
    "datasets>=4.6",
    "httpx>=0.27",
    "matchminer-ai>=0.4.0",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "openai>=2.8",
    "pandas>=2.3",
    "pillow>=11.0",
    "pyarrow>=23.0",
    "requests>=2.32",
    "scikit-learn>=1.8",
    "sentence-transformers>=6.1",
    "torch>=2.9",
    "transformers>=5.19",
    "vllm>=0.16",
]

[dependency-groups]
training = [
    "flash-attn>=2.8",
]
